name: office_management
description: Office Management System - Flutter Mobile App with GetX

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.5
  
  # HTTP Client
  dio: ^5.3.1
  
  # Storage
  get_storage: ^2.1.1
  
  # UI
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  
  # Validation
  validators: ^3.0.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Date/Time
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
